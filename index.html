<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitePost — API Testing</title>
    <meta name="description" content="A lightweight, cross-platform API testing application" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #131114;
        color: #d9d2c7;
      }

      .boot-loader {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        font-family: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }

      .boot-loader__pill {
        border: 1px solid rgba(217, 210, 199, 0.14);
        background: rgba(26, 23, 28, 0.55);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 12px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-loader">
        <div class="boot-loader__pill">Loading LitePost...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

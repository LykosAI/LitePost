[package]
name = "litepost"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "litepost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.11", features = ["json", "stream"] }
curl = "0.4"
base64 = "0.21"
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
url = "2"
tokio = { version = "1", features = ["sync", "net", "time", "macros", "io-util"] }
sha2 = "0.10"
rand = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# macOS release builds cross-compile x86_64 on ARM runners, where pkg-config
# can't provide OpenSSL for the foreign target — build it from source instead.
# Scoped to macOS so Linux keeps linking the system OpenSSL.
[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
